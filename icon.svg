<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="oceanBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a4f7a"/>
      <stop offset="55%" stop-color="#042442"/>
      <stop offset="100%" stop-color="#020b1a"/>
    </radialGradient>
    <linearGradient id="dolphinBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72efdd"/>
      <stop offset="45%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#0096c7"/>
    </linearGradient>
    <linearGradient id="dolphinBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#caf0f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#48cae4" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
  </defs>

  <!-- Dark Ocean Rounded Emblem -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#oceanBg)" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.85"/>
  <rect x="9" y="9" width="110" height="110" rx="22" fill="none" stroke="#00bbf9" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Sonar Pulse Arcs -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="14 8"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.28"/>
  <path d="M 88 30 A 26 26 0 0 1 104 52" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M 94 23 A 34 34 0 0 1 112 50" fill="none" stroke="#00bbf9" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Outer Neon Aura Stroke under Dolphin -->
  <path d="M 24 84 C 31 64, 44 43, 66 37 C 68 25, 76 20, 82 22 C 78 29, 78 34, 81 37 C 93 40, 102 49, 108 56 C 102 58, 96 58, 91 57 C 87 62, 82 65, 75 68 C 78 77, 74 84, 67 86 C 68 79, 66 74, 62 71 C 50 76, 40 83, 35 92 C 30 96, 22 100, 18 96 C 22 92, 23 89, 22 86 C 17 85, 14 81, 16 77 C 20 79, 23 81, 24 84 Z"
        fill="none" stroke="#00f5d4" stroke-width="6" stroke-linejoin="round" stroke-opacity="0.22"/>

  <!-- Sleek Leaping Neon Dolphin -->
  <path d="M 24 84 C 31 64, 44 43, 66 37 C 68 25, 76 20, 82 22 C 78 29, 78 34, 81 37 C 93 40, 102 49, 108 56 C 102 58, 96 58, 91 57 C 87 62, 82 65, 75 68 C 78 77, 74 84, 67 86 C 68 79, 66 74, 62 71 C 50 76, 40 83, 35 92 C 30 96, 22 100, 18 96 C 22 92, 23 89, 22 86 C 17 85, 14 81, 16 77 C 20 79, 23 81, 24 84 Z"
        fill="url(#dolphinBody)" stroke="#a8ffef" stroke-width="2" stroke-linejoin="round"/>

  <!-- Belly Highlight -->
  <path d="M 39 83 C 47 69, 60 58, 76 55 C 83 54, 89 55, 93 56 C 85 60, 77 64, 69 66 C 55 70, 45 77, 39 83 Z"
        fill="url(#dolphinBelly)"/>

  <!-- Neon Eye & Accent Bubbles -->
  <circle cx="88" cy="48" r="2.6" fill="#020b1a"/>
  <circle cx="88.8" cy="47.2" r="1.0" fill="#ffffff"/>
  <circle cx="34" cy="42" r="3.2" fill="none" stroke="#72efdd" stroke-width="1.6" stroke-opacity="0.8"/>
  <circle cx="44" cy="30" r="2.0" fill="#bf5af2" fill-opacity="0.85"/>
  <circle cx="96" cy="88" r="3.5" fill="none" stroke="#00bbf9" stroke-width="1.6" stroke-opacity="0.75"/>
  <circle cx="84" cy="98" r="2.0" fill="#00f5d4" fill-opacity="0.8"/>
</svg>
